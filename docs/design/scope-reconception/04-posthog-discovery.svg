<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050"><style>text{font-family:Arial,sans-serif}</style><rect width="1600" height="1050" fill="#f5f7fa"/><text x="30" y="40" font-size="25" fill="#344b62">Scope / PostHog — broader discovery inventory</text><text x="30" y="75" font-size="15" fill="#344b62">DESIGN DATA, NOT AN ADOPTED PROJECT MAP · pinned c54fec2163ad · eight inspected source units</text><text x="30" y="110" font-size="14" fill="#344b62">Outlined candidate titles are discovery vocabulary. Only Query cache has the two explicit assay bindings. No project-wide center has been derived.</text><rect x="30" y="150" width="365" height="310" rx="12" fill="white" stroke="#acbdce"/><text x="44" y="180" font-size="20" fill="#344b62">Ingestion API</text><text x="44" y="207" font-size="11" fill="#344b62">nodejs/src/ingestion/api/grpc-server.ts</text><text x="44" y="262" font-size="13" fill="#344b62">Candidate associations · not adopted</text><text x="44" y="293" font-size="14" fill="#344b62">◇ Acknowledgment barrier</text><text x="44" y="313" font-size="14" fill="#344b62">◇ Graceful drain</text><text x="44" y="333" font-size="14" fill="#344b62">◇ Bounded admission · fair admission</text><text x="44" y="353" font-size="14" fill="#344b62">◇ Cancellation releases capacity</text><text x="44" y="390" font-size="12" fill="#344b62">settleAndAck awaits completed.settled before</text><text x="44" y="406" font-size="12" fill="#344b62">ackCompleted. Historical mutation evidence;</text><text x="44" y="422" font-size="12" fill="#344b62">not an adopted binding.</text><rect x="423" y="150" width="365" height="310" rx="12" fill="white" stroke="#acbdce"/><text x="437" y="180" font-size="20" fill="#344b62">Event preprocessing</text><text x="437" y="207" font-size="11" fill="#344b62">nodejs/src/ingestion/common/steps/event-preprocessing</text><text x="437" y="262" font-size="13" fill="#344b62">Candidate associations · not adopted</text><text x="437" y="293" font-size="14" fill="#344b62">◇ Input contract enforcement</text><text x="437" y="390" font-size="12" fill="#344b62">Required-property checks; disabled</text><text x="437" y="406" font-size="12" fill="#344b62">enforcement and unknown types remain</text><text x="437" y="422" font-size="12" fill="#344b62">explicit exceptions.</text><rect x="816" y="150" width="365" height="310" rx="12" fill="white" stroke="#acbdce"/><text x="830" y="180" font-size="20" fill="#344b62">Event deduplication</text><text x="830" y="207" font-size="11" fill="#344b62">nodejs/src/ingestion/common/feature-flag-called-dedup</text><text x="830" y="262" font-size="13" fill="#344b62">Candidate associations · not adopted</text><text x="830" y="293" font-size="14" fill="#344b62">◇ Canonical encoding</text><text x="830" y="313" font-size="14" fill="#344b62">◇ Identity-scoped duplicate suppression</text><text x="830" y="390" font-size="12" fill="#344b62">Redis-backed claims. Mocked Redis cases do</text><text x="830" y="406" font-size="12" fill="#344b62">not establish downstream exactly-once</text><text x="830" y="422" font-size="12" fill="#344b62">behavior.</text><rect x="1209" y="150" width="365" height="310" rx="12" fill="white" stroke="#acbdce"/><text x="1223" y="180" font-size="20" fill="#344b62">Query cache</text><text x="1223" y="207" font-size="11" fill="#344b62">posthog/query_cache</text><text x="1223" y="262" font-size="13" fill="#344b62">2 adopted scoped promises</text><text x="1223" y="293" font-size="14" fill="#344b62">◇ Supersession safety</text><text x="1223" y="313" font-size="14" fill="#344b62">◇ Already-applied retry recognition</text><text x="1223" y="390" font-size="12" fill="#344b62">Two adopted local promises in the isolated</text><text x="1223" y="406" font-size="12" fill="#344b62">assay. Real Redis, fake storage; one shared</text><text x="1223" y="422" font-size="12" fill="#344b62">original oracle.</text><rect x="30" y="500" width="365" height="310" rx="12" fill="white" stroke="#acbdce"/><text x="44" y="530" font-size="20" fill="#344b62">Task creation</text><text x="44" y="557" font-size="11" fill="#344b62">products/tasks/backend/models.py</text><text x="44" y="612" font-size="13" fill="#344b62">Candidate associations · not adopted</text><text x="44" y="643" font-size="14" fill="#344b62">◇ Commit-ordered side effects</text><text x="44" y="740" font-size="12" fill="#344b62">Pending dispatch options persist with the</text><text x="44" y="756" font-size="12" fill="#344b62">run. Launch scheduling follows transaction</text><text x="44" y="772" font-size="12" fill="#344b62">commit.</text><rect x="423" y="500" width="365" height="310" rx="12" fill="white" stroke="#acbdce"/><text x="437" y="530" font-size="20" fill="#344b62">Dispatch intent</text><text x="437" y="557" font-size="11" fill="#344b62">products/tasks/backend/logic/services/workflow_dispatch.py</text><text x="437" y="612" font-size="13" fill="#344b62">Candidate associations · not adopted</text><text x="437" y="643" font-size="14" fill="#344b62">◇ Durable dispatch intent</text><text x="437" y="740" font-size="12" fill="#344b62">create_dispatch requires an atomic block and</text><text x="437" y="756" font-size="12" fill="#344b62">stores the pending dispatch row.</text><rect x="816" y="500" width="365" height="310" rx="12" fill="white" stroke="#acbdce"/><text x="830" y="530" font-size="20" fill="#344b62">Dispatch worker</text><text x="830" y="557" font-size="11" fill="#344b62">products/tasks/backend/management/commands/run_task_workflow_dispatcher.py</text><text x="830" y="612" font-size="13" fill="#344b62">Candidate associations · not adopted</text><text x="830" y="643" font-size="14" fill="#344b62">◇ Current authority</text><text x="830" y="740" font-size="12" fill="#344b62">Checks active user and team membership</text><text x="830" y="756" font-size="12" fill="#344b62">before dispatch; skip_user_check is an</text><text x="830" y="772" font-size="12" fill="#344b62">explicit exception.</text><rect x="1209" y="500" width="365" height="310" rx="12" fill="white" stroke="#acbdce"/><text x="1223" y="530" font-size="20" fill="#344b62">Outbound rate limiter</text><text x="1223" y="557" font-size="11" fill="#344b62">posthog/egress/limiter/outbound.py</text><text x="1223" y="612" font-size="13" fill="#344b62">Candidate associations · not adopted</text><text x="1223" y="643" font-size="14" fill="#344b62">◇ Identity-scoped rate budget</text><text x="1223" y="740" font-size="12" fill="#344b62">Shared facade delegates to the backend.</text><text x="1223" y="756" font-size="12" fill="#344b62">Redis failure fallback narrows the</text><text x="1223" y="772" font-size="12" fill="#344b62">enforcement scope.</text><text x="30" y="882" font-size="17" fill="#344b62">Source-observed interactions: task creation → dispatch intent → dispatch worker; ingestion API → driver settlement.</text><text x="30" y="915" font-size="15" fill="#344b62">Shared resource contexts: Redis (cache, deduplication, limiter); database (task rows and dispatch intent). No guaranteed edge is inferred.</text><text x="30" y="951" font-size="15" fill="#344b62">Design finding: actual source seams exist, but broader spec-owned components and adopted cross-component guarantees are still missing.</text><text x="30" y="982" font-size="15" fill="#344b62">Do not fill the missing graph with candidate titles masquerading as established contracts.</text></svg>
