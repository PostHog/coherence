# The upgrade test on every pull request and every push to main: an adopter
# project installs the previous published release, uses it (hooks, spec
# --check, run and refute, enact, decide, every hook event), then upgrades to
# this commit through npm pack, and nothing it did may be turned against it.
# 1.5.0 refused every adopter that had enacted a kernel practice until it
# recorded an amend decision for a change it never made (df-36efa8f2), with
# every test green, because no test had installed one release over another.
# It needs the npm registry for the previous release, so npm test leaves it out.
name: Upgrade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18"

      # npm pack builds dist through prepare, which needs the dev dependencies.
      - name: Install
        run: npm ci

      # The language server the fixture's chokepoint is checked with, as ci.yml installs it.
      - name: Language servers
        run: npm install --global typescript-language-server@5.1.3 typescript@5.9.2

      - name: Upgrade from the previous release
        run: npm run test:upgrade
