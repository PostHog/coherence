# Publishes @posthog/coherence to npm through trusted publishing: npm trusts
# this workflow file, in PostHog/coherence, running in the Release
# environment, and no token is stored anywhere.
#
# A merge to main that changes the version in package.json releases it: the
# check job compares that version with npm's, and the publish job runs only
# for a version npm does not have yet, so any other change to package.json
# releases nothing. It can also be run by hand from the Actions tab.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time; a second merge waits rather than racing the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Is this version new to npm?
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@posthog/coherence@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@posthog/coherence@$version is already on npm; nothing to release"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      # contents: write tags the release on GitHub; id-token: write is npm's trusted publishing.
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@11

      # No dependency's install script runs here.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      # prepare builds dist; the tarball is checked before it is published.
      - run: npm pack
      - name: Check the tarball runs
        run: |
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/posthog-coherence-*.tgz
          npx --no coherence spec --check

      - run: npm publish posthog-coherence-*.tgz --access public --provenance

      - name: Tag the release on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
